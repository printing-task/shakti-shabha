services:
  - type: web
    name: shakti-sabha-api
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        value: https://shakti-shabha.vercel.app,http://localhost:5173
      - key: SELF_PING_INTERVAL_MS
        value: 300000

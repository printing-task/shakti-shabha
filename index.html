<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Shakti Sabha — Union of Peace and Revolution. 7 years of independent on-ground impact (2019–Present)." />
    <title>Shakti Sabha | शक्ति सभा</title>
    <!-- Google Fonts & Icons CDN -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800;900&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600;1,700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <!-- Critical Anti-FOUC & Anti-Layout-Shift Styles -->
    <style>
      :root {
        --red: #bd1834;
        --red-dark: #94132a;
        --ink: #191817;
        --muted: #716d68;
        --paper: #fff;
        --soft: #f7f5f2;
        --line: #e8e4df;
        --green: #246345;
        --blue: #48458f;
        --gold: #b28b50;
        --serif: 'Playfair Display', Georgia, serif;
        --display: 'Cinzel', Georgia, serif;
        --sans: 'DM Sans', Arial, sans-serif;
      }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100vh;
        background-color: #ecebe8;
        color: var(--ink);
        font-family: var(--sans);
      }
      #root {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        width: 100%;
        max-width: 1440px;
        margin: 0 auto;
        background: var(--paper);
        box-shadow: 0 20px 70px rgba(21, 21, 21, 0.12);
        position: relative;
      }
      main {
        flex: 1 0 auto;
        min-height: 85vh;
        width: 100%;
      }
      footer {
        flex-shrink: 0;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
